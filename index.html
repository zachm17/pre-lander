<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0d12;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }
        .wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cta-button {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #000;
            font-size: 17px;
            font-weight: 900;
            padding: 18px 0;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            letter-spacing: -0.3px;
            width: 100%;
            transition: all 0.22s;
            box-shadow: 0 6px 28px rgba(34,197,94,0.35), 0 2px 0 rgba(255,255,255,0.12) inset;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .cta-button:active { transform: scale(0.97); }
        .cta-arrow {
            width: 26px; height: 26px; border-radius: 50%;
            background: rgba(0,0,0,0.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0;
        }
        .sub-text {
            margin-top: 14px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            font-weight: 500;
        }
        .sub-text span { color: #4ade80; font-weight: 700; }
        .fallback-text {
            margin-top: 24px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .fallback-text.visible { opacity: 1; }
        .fallback-text a { color: #4ade80; text-decoration: underline; font-weight: 600; }

        @media (max-width: 480px) {
            .cta-button { font-size: 15px; padding: 16px 0; border-radius: 12px; }
            .sub-text { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <button class="cta-button" onclick="handleContinue()">
            Continue
        </button>
        <p class="sub-text">Opens in <span>Safari</span></p>
        <p class="fallback-text">Not working? <a href="#" id="fallback-link">Tap here instead</a></p>
    </div>

    <script>
    const DEFAULT_DEST = 'https://ttfndme.com/';

    function buildDestUrl() {
        const fullUrl = window.location.href;
        const destIndex = fullUrl.indexOf('dest=');
        let dest;
        if (destIndex === -1) {
            dest = DEFAULT_DEST;
        } else {
            dest = fullUrl.substring(destIndex + 5);
            try { dest = decodeURIComponent(dest); } catch (e) {}
            if (!dest) dest = DEFAULT_DEST;
        }
        const currentParams = new URLSearchParams(window.location.search);
        const s1 = currentParams.get('s1');
        if (s1) {
            const separator = dest.includes('?') ? '&' : '?';
            dest = dest + separator + 's1=' + encodeURIComponent(s1);
        }
        return dest;
    }

    function isAndroid() { return /Android/.test(navigator.userAgent); }

    function convertToBrowserUrl(url) {
        try {
            const urlObj = new URL(url);
            const hostname = urlObj.hostname;
            const pathAndQuery = urlObj.pathname + urlObj.search + urlObj.hash;
            if (isAndroid()) {
                return 'intent://' + hostname + pathAndQuery + '#Intent;scheme=https;end;';
            } else {
                return url.replace(/^https:\/\//, 'x-safari-https://').replace(/^http:\/\//, 'x-safari-http://');
            }
        } catch (e) { return url; }
    }

    function handleContinue() {
        const dest = buildDestUrl();
        const browserUrl = convertToBrowserUrl(dest);
        window.location.href = browserUrl;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const dest = buildDestUrl();
        document.getElementById('fallback-link').href = convertToBrowserUrl(dest);

        // Auto-detect browser name
        document.querySelector('.sub-text').innerHTML = 'Opens in <span>' + (isAndroid() ? 'Chrome' : 'Safari') + '</span>';

        // Fallback
        var fallback = document.querySelector('.fallback-text');
        if (sessionStorage.getItem('prelander_visited')) {
            fallback.classList.add('visible');
        } else {
            sessionStorage.setItem('prelander_visited', 'true');
            setTimeout(function() { fallback.classList.add('visible'); }, 2500);
        }
    });
    </script>
</body>
</html>
